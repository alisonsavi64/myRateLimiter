version: "3.9"

networks:
  app-net:
    driver: bridge

volumes:
  redis-master-data:
  redis-replica-1-data:
  redis-replica-2-data:

services:

  # ── Go application ────────────────────────────────────────────────────
  app:
    build:
      context: ../application
      dockerfile: Dockerfile
    container_name: go-app
    restart: unless-stopped
    environment:
      TZ: UTC
      PORT: "8080"
      UPSTREAM_URL: ""
      REDIS_MODE: sentinel
      SENTINEL_HOST_1: sentinel-1
      SENTINEL_HOST_2: sentinel-2
      SENTINEL_HOST_3: sentinel-3
      SENTINEL_MASTER_NAME: mymaster
      RATE_LIMIT_BASIC: "60"
      RATE_LIMIT_PREMIUM: "600"
    networks:
      - app-net
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      redis-master:
        condition: service_healthy
      sentinel-1:
        condition: service_started
      sentinel-2:
        condition: service_started
      sentinel-3:
        condition: service_started

  # ── OpenResty / Nginx (rate limiter) ──────────────────────────────────
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - app-net
    environment:
      REDIS_MODE:           sentinel
      SENTINEL_HOST_1:      sentinel-1
      SENTINEL_HOST_2:      sentinel-2
      SENTINEL_HOST_3:      sentinel-3
      SENTINEL_MASTER_NAME: mymaster
      RATE_LIMIT:           "100"
      RATE_BURST:           "20"
    depends_on:
      app:
        condition: service_healthy
      sentinel-1:
        condition: service_started
      sentinel-2:
        condition: service_started
      sentinel-3:
        condition: service_started

  # ── Redis Master ──────────────────────────────────────────────────────
  redis-master:
    image: redis:7.2-alpine
    container_name: redis-master
    restart: unless-stopped
    command: redis-server /etc/redis/redis.conf
    volumes:
      - ./redis/redis-master.conf:/etc/redis/redis.conf:ro
      - redis-master-data:/data
    networks:
      - app-net
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Redis Replica 1 ───────────────────────────────────────────────────
  redis-replica-1:
    image: redis:7.2-alpine
    container_name: redis-replica-1
    restart: unless-stopped
    command: >
      redis-server /etc/redis/redis.conf
      --replicaof redis-master 6379
    volumes:
      - ./redis/redis-replica.conf:/etc/redis/redis.conf:ro
      - redis-replica-1-data:/data
    networks:
      - app-net
    expose:
      - "6379"
    depends_on:
      redis-master:
        condition: service_healthy

  # ── Redis Replica 2 ───────────────────────────────────────────────────
  redis-replica-2:
    image: redis:7.2-alpine
    container_name: redis-replica-2
    restart: unless-stopped
    command: >
      redis-server /etc/redis/redis.conf
      --replicaof redis-master 6379
    volumes:
      - ./redis/redis-replica.conf:/etc/redis/redis.conf:ro
      - redis-replica-2-data:/data
    networks:
      - app-net
    expose:
      - "6379"
    depends_on:
      redis-master:
        condition: service_healthy

  # ── Redis Sentinel 1 ──────────────────────────────────────────────────
  sentinel-1:
    image: redis:7.2-alpine
    container_name: sentinel-1
    restart: unless-stopped
    entrypoint:
      - "sh"
      - "-c"
      - |
        cp /etc/redis/sentinel.conf /tmp/sentinel.conf
        until redis-cli -h redis-master -p 6379 ping 2>/dev/null | grep -q PONG; do
          sleep 1
        done
        MASTER_IP=$$(ping -c 1 -w 1 redis-master 2>/dev/null | head -1 | sed 's/.*(\(.*\)).*/\1/')
        if [ -n "$$MASTER_IP" ]; then
          sed -i "s/redis-master/$$MASTER_IP/g" /tmp/sentinel.conf
        fi
        exec redis-sentinel /tmp/sentinel.conf
    volumes:
      - ./redis/sentinel.conf:/etc/redis/sentinel.conf:ro
    networks:
      - app-net
    expose:
      - "26379"
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica-1:
        condition: service_started
      redis-replica-2:
        condition: service_started

  # ── Redis Sentinel 2 ──────────────────────────────────────────────────
  sentinel-2:
    image: redis:7.2-alpine
    container_name: sentinel-2
    restart: unless-stopped
    entrypoint:
      - "sh"
      - "-c"
      - |
        cp /etc/redis/sentinel.conf /tmp/sentinel.conf
        until redis-cli -h redis-master -p 6379 ping 2>/dev/null | grep -q PONG; do
          sleep 1
        done
        MASTER_IP=$$(ping -c 1 -w 1 redis-master 2>/dev/null | head -1 | sed 's/.*(\(.*\)).*/\1/')
        if [ -n "$$MASTER_IP" ]; then
          sed -i "s/redis-master/$$MASTER_IP/g" /tmp/sentinel.conf
        fi
        exec redis-sentinel /tmp/sentinel.conf
    volumes:
      - ./redis/sentinel.conf:/etc/redis/sentinel.conf:ro
    networks:
      - app-net
    expose:
      - "26379"
    depends_on:
      redis-master:
        condition: service_healthy

  # ── Lambda Authorizer (serverless-offline) ───────────────────────────
  lambda-offline:
    build:
      context: ../lambda
      dockerfile: Dockerfile.offline
    container_name: lambda-offline
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      REDIS_HOST: redis-master
      REDIS_PORT: "6379"
      RATE_LIMIT_BASIC: "60"
      RATE_LIMIT_PREMIUM: "600"
    networks:
      - app-net
    depends_on:
      redis-master:
        condition: service_healthy

  # ── Redis Sentinel 3 ──────────────────────────────────────────────────
  sentinel-3:
    image: redis:7.2-alpine
    container_name: sentinel-3
    restart: unless-stopped
    entrypoint:
      - "sh"
      - "-c"
      - |
        cp /etc/redis/sentinel.conf /tmp/sentinel.conf
        until redis-cli -h redis-master -p 6379 ping 2>/dev/null | grep -q PONG; do
          sleep 1
        done
        MASTER_IP=$$(ping -c 1 -w 1 redis-master 2>/dev/null | head -1 | sed 's/.*(\(.*\)).*/\1/')
        if [ -n "$$MASTER_IP" ]; then
          sed -i "s/redis-master/$$MASTER_IP/g" /tmp/sentinel.conf
        fi
        exec redis-sentinel /tmp/sentinel.conf
    volumes:
      - ./redis/sentinel.conf:/etc/redis/sentinel.conf:ro
    networks:
      - app-net
    expose:
      - "26379"
    depends_on:
      redis-master:
        condition: service_healthy
