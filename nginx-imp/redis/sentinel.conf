port 26379
bind 0.0.0.0
protected-mode no

# Monitor master; quorum = 2 (majority of 3 sentinels)
sentinel monitor mymaster redis-master 6379 2

# Mark master as down after 5s of no response
sentinel down-after-milliseconds mymaster 5000

# Allow 30s for the failover to complete
sentinel failover-timeout mymaster 30000

# Reconfigure one replica at a time during failover
sentinel parallel-syncs mymaster 1

loglevel notice
logfile ""
